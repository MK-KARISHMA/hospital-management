spring.application.name=hospital-management-db



# MySQL database properties
# The JDBC URL format: jdbc:mysql://[host]:[port]/[database_name]
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_management_db
# Your MySQL database credentials
spring.datasource.username=root
spring.datasource.password=Allah@2513
# Driver class name (Optional in newer Spring Boot versions, as it auto-detects it)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA and Hibernate Properties
# Specifies the DDL schema management strategy (none, update, create, create-drop, validate)
spring.jpa.hibernate.ddl-auto=update
# Shows generated SQL queries in the console log
spring.jpa.show-sql=true
# Formats the logged SQL for better readability
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.open-in-view=false

# Specifies the database platform dialect (Optional; Spring Boot usually infers this)
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect